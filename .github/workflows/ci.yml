# CI gate — audit item #12.
# Railway pins the last good image when a deploy crashes, so a broken push
# LOOKS live while serving old code (bitten 2026-07-05). This workflow is the
# red/green truth: if it's red, the push never really shipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches runtime.txt (python-3.11.9)
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import gate
        # The same pre-push ritual, enforced: if main.py cannot import,
        # uvicorn cannot boot and Railway will silently keep the old image.
        run: python -c "import main"

      - name: Spine tests
        run: python test_spine.py

      - name: Payroll tests
        run: python test_payroll.py

      - name: Parties & customer-intel tests
        run: python test_parties.py

      - name: Invoice tests
        run: python test_invoices.py

      - name: CFO tools tests
        run: python test_cfo_tools.py

      - name: Cabinet store tests
        run: python test_cabinet_store.py

      - name: WhatsApp bot tests
        run: python test_whatsapp_bot.py

      - name: Investigate tests
        run: python test_investigate.py

      - name: Debtors tests
        run: python test_debtors.py

      - name: Cash forecast tests
        run: python test_cash_forecast.py

      - name: Recommendations ledger tests
        run: python test_rec_store.py

      - name: LLM fallback tests
        run: python test_llm.py

      - name: Entitlements tests
        run: python test_entitlements.py

      - name: Compliance calendar tests
        run: python test_compliance.py

      - name: Loyverse importer tests
        run: python test_loyverse.py

      - name: Membership / team-roles tests
        run: python test_membership.py

      - name: Budgets tests
        run: python test_budgets.py

      - name: Rate-limit tests
        run: python test_rate_limit.py

      - name: Multi-business tests
        run: python test_businesses.py
