# CI gate — audit item #12.
# A host that fails to boot a new image keeps serving the last good one, so a
# broken push LOOKS live while serving old code (bitten on Railway 2026-07-05).
# This workflow is the red/green truth: if it's red, the push never really shipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches runtime.txt (python-3.11.9)
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Import gate
        # The same pre-push ritual, enforced: if main.py cannot import,
        # uvicorn cannot boot and the host will silently keep the old image.
        run: python -c "import main"

      - name: Every test file
        # This used to be one step per file, listed by hand. A list maintained
        # by hand is a list that goes stale: test_identity.py was never added to
        # it, so its 24 tests never ran here. pytest finds every test_*.py.
        #
        # What the suites guard, for whoever reads a red run:
        #   books_integrity / money_and_stays — every posting lands in real
        #     books, the rebuild reads past 1,000 events, Start Fresh touches one
        #     business, a sale or payment is posted once.
        #   booking_engine / public_stay — BOOKING_STATUSES matches the CHECK in
        #     migration 0029; the public site can never post revenue.
        #   guest_mail — the guest never hears from AI-BOS by name.
        #   tier_contract / schema_contract — the numbers the aibos repo checks.
        run: python -m pytest -q
