# AI-BOS API on Render's free tier.
#
# WHY RENDER AND NOT RAILWAY
#
# Railway no longer has a free tier. It gives a small one-off trial credit and
# then bills, which is how the API came to be switched off. Render still has a
# genuinely free web service and does not ask for a card to use it.
#
# WHAT FREE COSTS YOU, HONESTLY
#
# A free Render service SLEEPS after 15 minutes with no traffic, and the next
# request has to wait for it to boot. With pandas, numpy and reportlab to load,
# expect roughly 40 to 60 seconds on that first request. Every request after it
# is normal speed until it goes quiet again for 15 minutes.
#
# For a business tool that people open a few times a day, that first-hit wait is
# the thing they will complain about. Two ways to deal with it:
#
#   - Leave it. Free, and the app is honest about being slow to wake.
#   - Ping /health every 10 minutes from an uptime checker so it never sleeps.
#     Render's free allowance is 750 instance-hours a month and a month is about
#     730 hours, so ONE service pinged around the clock still fits inside free.
#     A second always-on service would not.
#
# Render reads this file when you click "New +" -> "Blueprint" and point it at
# this repository.

services:
  - type: web
    name: aibos-api
    runtime: python
    plan: free
    region: frankfurt          # nearest of Render's regions to Lusaka
    branch: main
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      # Pinned to match runtime.txt. Render defaults to a newer Python than
      # some of these wheels have builds for.
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Without these three, the app runs but does nothing useful ────────
      # sync: false means "ask me for it in the dashboard, do not store it
      # here". None of these belong in a file in a public repository.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY          # the service_role key, NOT the anon key
        sync: false
      # THE AI KEY. Gemini is the one to set: Groq stopped working, and a free
      # Gemini key from aistudio.google.com needs no card.
      #
      # llm.py picks the provider from whichever key is present and Gemini wins
      # if both are, so an old GROQ_API_KEY can stay set without fighting it.
      # Google publish an OpenAI-compatible endpoint, which is why swapping
      # provider did not mean rewriting every prompt.
      - key: GEMINI_API_KEY
        sync: false

      # ── Without this the browser blocks every call from the site ─────────
      # Comma separated, no trailing slash, e.g.
      #   https://aibos.vercel.app,https://www.your-domain.com
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Strongly recommended ────────────────────────────────────────────
      # Lets the API verify a login locally instead of calling Supabase on
      # every request. Leave it unset and auth still works, just slower.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # The public address of the front end, used in links the API generates.
      - key: PUBLIC_APP_URL
        sync: false
      # Must match CRON_SECRET on Vercel or the nightly brief job is refused.
      - key: CRON_SECRET
        sync: false
      # Hospitality only, but not optional once that module is used: guest ID
      # document numbers are sealed with this BEFORE they reach the database,
      # because Supabase's at-rest encryption does not protect against a leaked
      # service-role key and this whole API runs on that key. It fails CLOSED —
      # with no key set, capturing a guest ID is refused rather than written in
      # the clear. Generate once:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Changing it later makes every already-sealed value unreadable.
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      # ── Sized for a 512MB box ───────────────────────────────────────────
      # The analysis cabinet and the payments store are both plain dictionaries
      # in this process's memory, so they are capped or a few large uploads
      # would evict everyone. The defaults in main.py (500 and 5000) were set
      # when this ran on Railway with more room. Render's free instance has
      # 512MB, of which Python plus pandas, numpy and reportlab take a good
      # 150-250MB before a single row is read.
      #
      # These are retention limits, not capability limits: the oldest entry is
      # evicted, so a user's own recent work is still there.
      - key: MAX_CABINET_ENTRIES
        value: "150"
      - key: MAX_PAYMENTS
        value: "1000"
      # MAX_UPLOAD_BYTES is deliberately left at its 15MB default rather than
      # quietly shrinking what people can upload. If the service starts
      # restarting under memory pressure, this is the first knob to turn: a
      # spreadsheet costs several times its file size once parsed.

      # ── Everything below is per-feature. Leave unset and that feature is
      #    simply off; nothing else breaks. ─────────────────────────────────
      # Mobile money. PAYMENTS_SIMULATION=1 lets checkout be exercised end to
      # end without real credentials, which is the sane way to start.
      - key: PAYMENTS_SIMULATION
        value: "1"
      - key: PAYMENTS_CALLBACK_SECRET
        sync: false
      # Model ids, if a provider ever retires one. Defaults live in llm.py and
      # are the current Gemini Flash line; a retirement is a variable change
      # here, not a deploy:
      #   LLM_MODEL, LLM_FALLBACK_MODEL, LLM_VISION_MODEL, LLM_TRANSCRIBE_MODEL
      # Check https://ai.google.dev/gemini-api/docs/models before setting one.
      #
      # GROQ_API_KEY is still read if you ever want to switch back.
      #
      # Email (Resend), WhatsApp and Google Places are all optional:
      #   RESEND_API_KEY, BRIEF_FROM_EMAIL
      #   WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_VERIFY_TOKEN,
      #   WHATSAPP_APP_SECRET, WHATSAPP_TEMPLATE
      #   PLACES_API_KEY
      # Add them in the dashboard when you have the keys.
